<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eindampfen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05080b;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:#cfe3f1;font-size:13px;
    background:rgba(0,0,0,.45);padding:6px 12px;border-radius:999px;opacity:.85;transition:opacity .6s;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">Leertaste: Pause · ← →: spulen · R: neu starten</div>
<script>
'use strict';
/* =====================================================================
   EINDAMPFEN – 35-Sekunden-Animation (Klasse 6)
   Komplett zeitbasiert: drawFrame(t) zeichnet exakt den Zeitpunkt t.
   ===================================================================== */
const W=1920,H=1080,DUR=35;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const FONT='Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif';

/* ---------------- Mathe-Helfer ---------------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const sstep=(t,a,b)=>{const k=seg(t,a,b);return k*k*(3-2*k);};
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eout=k=>1-Math.pow(1-k,3);
const eback=k=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);};
const D2R=Math.PI/180;
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453123;return x-Math.floor(x);}
function noise(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1;}
function fbm(x){return noise(x)*.6+noise(x*2.13+7.1)*.28+noise(x*4.37+3.3)*.12;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function qbez(p0,p1,p2,k){const a=(1-k)*(1-k),b=2*(1-k)*k,c=k*k;return[a*p0[0]+b*p1[0]+c*p2[0],a*p0[1]+b*p1[1]+c*p2[1]];}
function track(keys,t,ease=eio){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const[t0,v0]=keys[i],[t1,v1]=keys[i+1];
    if(t<=t1){const k=ease((t-t0)/(t1-t0));return v0.map((v,j)=>lerp(v,v1[j],k));}}
  return keys[keys.length-1][1];
}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}

/* ---------------- Zeitplan ---------------- */
const T={
  clampIn:3.3, grab:4.7, lift0:5.0, lift1:5.9,
  ltUp:6.8, click:8.0, gas0:8.25, gas1:8.6, ignite:8.75, ltOff:9.05,
  air0:9.7, air1:10.3, move0:10.3, move1:11.6,
  heatEnd:19.0, out1:19.9, gasOff0:19.9, gasOff1:20.3,
  lens:20.3, info:22.8
};

/* ---------------- Geometrie ---------------- */
const R=22, RI=19, L=300, JAW=245;         // Reagenzglas
const HOLES=[360,430,500,570,640], MAIN_X=640, TUBE_Y=856;
const JAW_Y=TUBE_Y-JAW, WAIT_Y=341;
const BX=1180, MOUTH=560;                   // Bunsenbrenner
const HEAT_A=32*D2R, HEAT_O=[1188,484];
const HEAT_H=[HEAT_O[0]+JAW*Math.sin(HEAT_A),HEAT_O[1]-JAW*Math.cos(HEAT_A)];
const OUT_A=24*D2R, OUT_O=[1030,452];
const OUT_H=[OUT_O[0]+JAW*Math.sin(OUT_A),OUT_O[1]-JAW*Math.cos(OUT_A)];
const TAPX=1660;

/* ---------------- Zustände ---------------- */
function holder(t){
  let x,y,a=0;
  if(t<T.clampIn){x=-300;y=500;a=-8*D2R;}
  else if(t<T.grab){const k=eout(seg(t,T.clampIn,T.grab));const p=qbez([-300,500],[380,450],[MAIN_X,JAW_Y],k);x=p[0];y=p[1];a=-8*D2R*(1-k);}
  else if(t<T.lift0){x=MAIN_X;y=JAW_Y;}
  else if(t<T.lift1){x=MAIN_X;y=lerp(JAW_Y,WAIT_Y,eio(seg(t,T.lift0,T.lift1)));}
  else if(t<T.move0){x=MAIN_X;y=WAIT_Y;}
  else if(t<T.move1){const k=eio(seg(t,T.move0,T.move1));const p=qbez([MAIN_X,WAIT_Y],[1060,150],HEAT_H,k);x=p[0];y=p[1];a=HEAT_A*eio(seg(t,T.move0+.15,T.move1));}
  else if(t<T.heatEnd){x=HEAT_H[0];y=HEAT_H[1];a=HEAT_A;}
  else{const k=eio(seg(t,T.heatEnd,T.out1));x=lerp(HEAT_H[0],OUT_H[0],k);y=lerp(HEAT_H[1],OUT_H[1],k);a=lerp(HEAT_A,OUT_A,k);}
  const env=sstep(t,11.7,12.3)*(1-sstep(t,18.5,19.0));
  if(env>0){const s=5*Math.sin(2*Math.PI*.9*(t-11.7))*env;a+=1.3*D2R*Math.sin(2*Math.PI*.45*(t-11.7)+1)*env;x+=Math.sin(a)*s;y-=Math.cos(a)*s;}
  return{x,y,a};
}
function clampOpen(t){return eio(seg(t,3.85,4.15))*(1-eout(seg(t,4.6,4.76)));}
function tubeState(t){
  if(t<T.grab)return{ox:MAIN_X,oy:TUBE_Y,a:0};
  const h=holder(t);return{ox:h.x-JAW*Math.sin(h.a),oy:h.y+JAW*Math.cos(h.a),a:h.a};
}
/* Schwappen der Flüssigkeit: vorab simuliert (Feder-Dämpfer) */
const SLOSH=(()=>{const dt=1/240,N=Math.ceil(DUR/dt)+4,arr=new Float32Array(N);
  let th=0,om=0;const w=2*Math.PI*2.3,z=.13,G=26000;
  for(let i=0;i<N;i++){const t=i*dt,pm=tubeState(t-dt),pc=tubeState(t),pp=tubeState(t+dt);
    const ax=(pp.ox-2*pc.ox+pm.ox)/(dt*dt),ay=(pp.oy-2*pc.oy+pm.oy)/(dt*dt);
    const target=clamp(Math.atan2(ax,G-ay),-.2,.2);
    om+=(w*w*(target-th)-2*z*w*om)*dt;th+=om*dt;arr[i]=th;}
  return arr;})();
function slosh(t){const f=t*240,i=Math.floor(f);if(i<0)return 0;if(i>=SLOSH.length-1)return SLOSH[SLOSH.length-1];return-lerp(SLOSH[i],SLOSH[i+1],f-i);}

function liquidFrac(t){const k=seg(t,12.9,18.5);return 1-(1-Math.cos(Math.PI*k))/2;}
function contactAmt(t){return sstep(t,11.2,11.6)*(1-sstep(t,19.0,19.35));}
function flameState(t){
  const on=t>=T.ignite?1:0, grow=eout(seg(t,T.ignite,T.ignite+.28));
  const air=eio(seg(t,T.air0,T.air1)), blue=sstep(air,.2,.9);
  const off=1-sstep(t,T.gasOff0,T.gasOff1);
  return{on,amt:on*grow*off,air,blue,lum:1-blue};
}
function lighterState(t){
  const K=[[6.8,[1440,943,-4]],[7.2,[1405,872,-14]],[7.9,[1197,553,-37]],[9.1,[1197,553,-37]],[9.5,[1335,600,-28]],[10.1,[1440,943,-4]]];
  const v=track(K,t);
  const trig=sstep(t,7.97,8.03)*(1-sstep(t,9.02,9.08));
  const fl=eout(seg(t,8.03,8.16))*(1-seg(t,9.05,9.12));
  return{x:v[0],y:v[1],a:v[2]*D2R,trig,fl};
}
function gasLever(t){return-90*D2R*eio(seg(t,T.gas0,T.gas1))*(1-seg(t,T.gasOff0,T.gasOff0+.3));}

/* ---------------- Kamera ---------------- */
const CAM=[
 [0,[960,560,1.0]],[2.3,[960,560,1.05]],[3.8,[600,650,1.5]],[5.0,[600,640,1.5]],[5.9,[610,560,1.45]],
 [7.0,[1310,630,1.5]],[10.2,[1300,630,1.5]],[11.7,[1270,335,1.65]],[19.0,[1262,350,1.8]],
 [20.3,[1150,420,2.5]],[22.8,[1160,420,2.55]],[35,[1160,420,2.55]]];
function camAt(t){const v=track(CAM,t);return{x:v[0],y:v[1],z:v[2]};}
let CAMNOW={x:960,y:540,z:1};
function toScreen(x,y){return[(x-CAMNOW.x)*CAMNOW.z+W/2,(y-CAMNOW.y)*CAMNOW.z+H/2];}

/* ---------------- Füllstand-Geometrie (Volumen bleibt erhalten, Oberfläche bleibt waagerecht) ---------------- */
const INNER=(()=>{const p=[],top=-L+2;p.push([-RI,top],[-RI,-R]);
  for(let i=1;i<28;i++){const an=Math.PI-i*Math.PI/28;p.push([Math.cos(an)*RI,-R+Math.sin(an)*RI]);}
  p.push([RI,-R],[RI,top]);return p;})();
function clipHalf(nx,ny,h){const P=INNER,out=[],xs=[];
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
    const da=a[0]*nx+a[1]*ny-h,db=b[0]*nx+b[1]*ny-h;
    if(da>=0)out.push(a);
    if((da>=0)!==(db>=0)){const k=da/(da-db),q=[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];out.push(q);xs.push(q);}}
  let A=0;for(let i=0;i<out.length;i++){const p=out[i],q=out[(i+1)%out.length];A+=p[0]*q[1]-q[0]*p[1];}
  return{A:Math.abs(A)/2,poly:out,xs};}
function solveLevel(nx,ny,target){let mn=1e9,mx=-1e9;
  for(const p of INNER){const d=p[0]*nx+p[1]*ny;if(d<mn)mn=d;if(d>mx)mx=d;}
  let lo=mn,hi=mx;for(let i=0;i<26;i++){const m=(lo+hi)/2;if(clipHalf(nx,ny,m).A>target)lo=m;else hi=m;}
  return(lo+hi)/2;}
const FULL_A=clipHalf(0,1,-96).A, SALT_A=430;
function levelAt(t){const s=tubeState(t),A=s.a+slosh(t);const nx=Math.sin(A),ny=Math.cos(A);
  return{nx,ny,h:solveLevel(nx,ny,FULL_A*liquidFrac(t))};}

/* ---------------- Partikel (vorab berechnet, deterministisch) ---------------- */
function bubbleRate(t){if(t<11.9||t>18.7)return 0;let r=t<12.8?3+6*seg(t,11.9,12.8):9+55*sstep(t,12.8,13.8);return r*Math.sqrt(liquidFrac(t))*(.8+.2*noise(t*3));}
const BUBBLES=(()=>{const r=rng(7),a=[];let t=11.9;
  while(t<18.7){const rate=Math.max(bubbleRate(t),.5);t+=-Math.log(1-r()*.999)/rate;if(t>=18.7)break;
    const x0=(r()*2-1)*(RI-6);const y0=-R+Math.sqrt(Math.max(0,(RI-4)**2-x0*x0))-r()*5;
    const big=t>13.3;a.push({tb:t,x0,y0,r0:big?1.4+r()*3.4:.7+r()*1.1,v0:60+r()*70,acc:250+r()*260,wob:r()*6.28,wa:.8+r()*1.8});}
  return a;})();
function steamRate(t){if(t<12.6)return 0;if(t<13.8)return 45*sstep(t,12.6,13.8);if(t<18.5)return 45*(.78+.22*noise(t*2.2));
  if(t<19.4)return lerp(45,8,seg(t,18.5,19.4));return lerp(8,0,seg(t,19.4,20.6));}
const STEAM=(()=>{const r=rng(21),a=[];let t=12.6;
  while(t<20.6){const rate=Math.max(steamRate(t),.4);t+=-Math.log(1-r()*.999)/rate;if(t>=20.6)break;
    a.push({tb:t,life:1.5+r()*1.2,r0:5+r()*6,vy:80+r()*65,dr:(r()*2-1)*14,sd:r()*100,pk:.22+r()*.14,gr:40+r()*30,vis:clamp(steamRate(t)/45,.25,1)});}
  return a;})();
const DROPS=(()=>{const r=rng(33),a=[];for(let i=0;i<70;i++){const e=r()<.55;const s=r()<.5?-1:1;
  const x=e?s*(RI-1.5-r()*3):(r()*2-1)*(RI-3);
  a.push({x,y:-L+14+r()*115,ta:13.0+r()*3.5,rm:.8+r()*1.9,run:r()<.25,tr:0,sd:r()*9});a[i].tr=a[i].ta+1.4+r()*2.2;}return a;})();
const GRAINS=(()=>{const r=rng(44),a=[];for(let i=0;i<170;i++){const ph=(.08+r()*.84)*Math.PI;const rho=RI-.6-r()*13;
  a.push({x:Math.cos(ph)*rho,y:-R+Math.sin(ph)*rho,s:1+r()*2.4,rot:r()*6.28,sh:.75+r()*.25,tw:r()*20});}return a;})();
const WALLDEP=(()=>{const r=rng(55),a=[];for(let i=0;i<120;i++){const s=r()<.5?-1:1;a.push({side:s,y:-205+r()*200,dx:r()*4,s:.7+r()*1.7});}return a;})();
const SPECKS=(()=>{const r=rng(66),a=[];for(let i=0;i<34;i++)a.push({x:(r()*2-1)*(RI-3),y:-6-r()*90,ph:r()*6.28,sp:.6+r()*1.2,s:.8+r()*1.3});return a;})();
const CRACK=(()=>{const r=rng(77),a=[];for(let i=0;i<14;i++)a.push({tb:18.2+r()*1.0,x:(r()*2-1)*10,vx:(r()*2-1)*60,vy:-(70+r()*90),s:.9+r()*1.2});return a;})();
const SPARKS=(()=>{const r=rng(88),a=[];for(let i=0;i<9;i++){const an=-Math.PI/2+(r()*2-1)*1.3;const v=150+r()*220;a.push({vx:Math.cos(an)*v,vy:Math.sin(an)*v,life:.12+r()*.18});}return a;})();

/* Sprites */
function mkSprite(sz,stops){const c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');
  const gr=g.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);for(const[s,col]of stops)gr.addColorStop(s,col);g.fillStyle=gr;g.fillRect(0,0,sz,sz);return c;}
const SPR_STEAM=mkSprite(128,[[0,'rgba(240,248,255,1)'],[.4,'rgba(235,245,255,.55)'],[.75,'rgba(230,242,255,.15)'],[1,'rgba(230,242,255,0)']]);

/* =====================================================================
   HINTERGRUND (einmal vorab gerendert: scharf + unscharf für Tiefenschärfe)
   ===================================================================== */
const BG={x0:-520,y0:-420,w:2960,h:1840};
function paintBG(c){
  const wg=c.createLinearGradient(0,-420,0,800);wg.addColorStop(0,'#121c24');wg.addColorStop(.55,'#22343f');wg.addColorStop(1,'#2b414e');
  c.fillStyle=wg;c.fillRect(BG.x0,BG.y0,BG.w,1240);
  const TS=112,r=rng(11);
  for(let y=792-TS;y>BG.y0-TS;y-=TS)for(let x=-520;x<2460;x+=TS){
    const v=(r()-.5)*.06;c.fillStyle=v>0?`rgba(255,255,255,${v})`:`rgba(0,0,0,${-v})`;c.fillRect(x,y,TS,TS);
    const g=c.createLinearGradient(x,y,x+TS,y+TS);g.addColorStop(0,'rgba(255,255,255,.05)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.06)');
    c.fillStyle=g;c.fillRect(x+2,y+2,TS-4,TS-4);}
  c.lineWidth=3;c.strokeStyle='rgba(6,10,14,.55)';c.beginPath();
  for(let y=792;y>BG.y0;y-=TS){c.moveTo(BG.x0,y);c.lineTo(2440,y);}
  for(let x=-520;x<2460;x+=TS){c.moveTo(x,BG.y0);c.lineTo(x,792);}c.stroke();
  c.lineWidth=1;c.strokeStyle='rgba(255,255,255,.045)';c.beginPath();
  for(let y=792;y>BG.y0;y-=TS){c.moveTo(BG.x0,y+2);c.lineTo(2440,y+2);}
  for(let x=-520;x<2460;x+=TS){c.moveTo(x+2,BG.y0);c.lineTo(x+2,792);}c.stroke();
  let lg=c.createRadialGradient(880,180,0,880,180,1250);lg.addColorStop(0,'rgba(255,228,185,.16)');lg.addColorStop(.5,'rgba(255,228,185,.05)');lg.addColorStop(1,'rgba(255,228,185,0)');
  c.fillStyle=lg;c.fillRect(BG.x0,BG.y0,BG.w,1240);
  // Regal mit Chemikalien (weich, weit weg)
  c.save();c.filter='blur(2.5px)';
  c.fillStyle='#4b3a2a';c.fillRect(30,290,760,16);c.fillStyle='rgba(255,255,255,.08)';c.fillRect(30,290,760,3);
  c.fillStyle='#2c241c';c.beginPath();c.moveTo(110,306);c.lineTo(150,306);c.lineTo(110,350);c.fill();c.beginPath();c.moveTo(690,306);c.lineTo(730,306);c.lineTo(730,350);c.fill();
  const bottle=(x,w,h,col,cap,lab)=>{const y=290-h;const g=c.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(.3,col);g.addColorStop(.6,col);g.addColorStop(1,'rgba(0,0,0,.4)');
    c.fillStyle=g;rr(c,x,y+h*.28,w,h*.72,8);c.fill();rr(c,x+w*.28,y+h*.08,w*.44,h*.25,4);c.fill();
    c.fillStyle=cap;rr(c,x+w*.24,y,w*.52,h*.11,3);c.fill();
    if(lab){c.fillStyle='rgba(240,236,226,.85)';c.fillRect(x+5,y+h*.5,w-10,h*.26);}
    c.fillStyle='rgba(255,255,255,.18)';c.fillRect(x+w*.2,y+h*.32,3,h*.6);};
  bottle(90,62,150,'#5a3412','#1a1a1a',1);bottle(185,54,122,'rgba(70,150,230,.85)','#e8e8e8',1);
  c.fillStyle='rgba(120,200,140,.55)';c.beginPath();c.moveTo(285,290);c.lineTo(355,290);c.lineTo(332,215);c.lineTo(332,175);c.lineTo(308,175);c.lineTo(308,215);c.closePath();c.fill();
  bottle(395,74,96,'#e9eef1','#2f6fc4',1);bottle(500,50,172,'#4a2c10','#1a1a1a',1);
  c.fillStyle='rgba(200,225,240,.3)';rr(c,590,215,66,75,4);c.fill();c.fillStyle='rgba(200,225,240,.25)';rr(c,600,232,46,58,4);c.fill();
  c.fillStyle='#f1f3f4';rr(c,690,190,56,100,10);c.fill();c.strokeStyle='#f1f3f4';c.lineWidth=4;c.beginPath();c.moveTo(718,190);c.quadraticCurveTo(718,160,760,150);c.stroke();
  c.restore();
  // Steckdosenleiste / Leitung rechts
  c.save();c.filter='blur(1.5px)';c.fillStyle='#3a4a55';rr(c,1760,600,150,46,8);c.fill();
  c.fillStyle='#222c33';for(let i=0;i<3;i++){c.beginPath();c.arc(1792+i*44,623,11,0,7);c.fill();}c.restore();
  // Schatten an der Wand über dem Tisch
  let sg=c.createLinearGradient(0,742,0,792);sg.addColorStop(0,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(0,0,0,.45)');c.fillStyle=sg;c.fillRect(BG.x0,742,BG.w,50);
  // Labortisch
  let tg=c.createLinearGradient(0,792,0,1012);tg.addColorStop(0,'#1a2026');tg.addColorStop(1,'#2a3139');c.fillStyle=tg;c.fillRect(BG.x0,792,BG.w,220);
  let sh=c.createRadialGradient(900,900,0,900,900,900);sh.addColorStop(0,'rgba(255,235,200,.07)');sh.addColorStop(1,'rgba(255,235,200,0)');c.fillStyle=sh;c.fillRect(BG.x0,792,BG.w,220);
  for(let i=0;i<900;i++){c.fillStyle=`rgba(255,255,255,${.015+r()*.03})`;c.fillRect(BG.x0+r()*BG.w,792+r()*218,1.2,1.2);}
  c.fillStyle='rgba(255,255,255,.13)';c.fillRect(BG.x0,1011,BG.w,3);
  let fg=c.createLinearGradient(0,1014,0,1420);fg.addColorStop(0,'#151a1f');fg.addColorStop(1,'#07090b');c.fillStyle=fg;c.fillRect(BG.x0,1014,BG.w,410);
}
function makeBG(scale,blur){const c=document.createElement('canvas');c.width=Math.round(BG.w*scale);c.height=Math.round(BG.h*scale);
  const g=c.getContext('2d');g.setTransform(scale,0,0,scale,-BG.x0*scale,-BG.y0*scale);paintBG(g);
  if(!blur)return c;const b=document.createElement('canvas');b.width=c.width;b.height=c.height;const bg=b.getContext('2d');bg.filter=`blur(${blur}px)`;bg.drawImage(c,0,0);return b;}
let BG_SHARP=null,BG_BLUR=null;

/* =====================================================================
   OBJEKTE
   ===================================================================== */

      ctx.strokeStyle=`rgba(245,248,252,${.22*dep*sstep(t,tk+.3,tk+1.2)})`;ctx.lineWidth=1.3;ctx.beginPath();ctx.ellipse((m[0]+n[0])/2,(m[1]+n[1])/2,Math.hypot(n[0]-m[0],n[1]-m[1])/2,3,Math.atan2(n[1]-m[1],n[0]-m[0]),0,7);ctx.stroke();}}

const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tctx=tmp.getContext('2d');

  const F=flameState(t),Ls=lighterState(t),TS=tubeState(t),Hd=holder(t),contact=contactAmt(t);

  drawBurner(t,F);
  drawFlame(t,F,contact);
  drawRackBack();
  HOLES.slice(0,3).forEach((hx,i)=>drawTube(hx,TUBE_Y,0,i===1?()=>{ctx.save();innerPath();ctx.clip();simpleLiquid(30,0);ctx.restore();}:null));

  if(t>=T.clampIn-.05)clampPiece(Hd,'back',clampOpen(t));
  drawTube(TS.ox,TS.oy,TS.a,()=>mainInner(t,S),{tape:true,heat:contact*F.amt});
  if(t>=T.clampIn-.05)clampPiece(Hd,'front',clampOpen(t));
  drawRackFront();
  // Feuerzeug
  const lh=clamp((943-Ls.y)/200);softShadow(Ls.x+170+40*lh,969,170*(1-.3*lh),9,.5*(1-lh*.85));
  drawLighter(Ls);
  drawFlameLicks(t,F,S,contact);
  drawGoggles();
  // Dampf
  for(const p of STEAM){const age=t-p.tb;if(age<0)break;if(age>p.life)continue;const st=tubeState(p.tb);const ax=Math.sin(st.a),ay=-Math.cos(st.a);
    const mx=st.ox+ax*L,my=st.oy+ay*L;const jet=70*.35*(1-Math.exp(-age/.35));
    const x=mx+ax*jet+p.dr*age+22*age*fbm(p.sd*13.1+age*1.1),y=my+ay*jet-(p.vy*age-.12*p.vy*age*age);
    const r=p.r0+p.gr*age;const al=p.pk*p.vis*sstep(age,.06,.35)*Math.pow(1-age/p.life,1.6);if(al<=.003)continue;
    ctx.globalAlpha=al;ctx.drawImage(SPR_STEAM,x-r,y-r,2*r,2*r);}
  ctx.globalAlpha=1;

  const tipx=Ls.x-Math.cos(Ls.a)*3,tipy=Ls.y-Math.sin(Ls.a)*3;drawSmallFlame(tipx,tipy-1,Ls.fl,t);
  if(t>T.click&&t<T.click+.35){ctx.save();ctx.globalCompositeOperation='lighter';const k=seg(t,T.click,T.click+.08);
    const fg=ctx.createRadialGradient(tipx,tipy,0,tipx,tipy,22);fg.addColorStop(0,`rgba(200,220,255,${.9*(1-k)})`);fg.addColorStop(1,'rgba(200,220,255,0)');ctx.fillStyle=fg;ctx.fillRect(tipx-22,tipy-22,44,44);
    for(const s of SPARKS){const age=t-T.click;if(age>s.life)continue;const x=tipx+s.vx*age,y=tipy+s.vy*age+450*age*age;ctx.strokeStyle=`rgba(255,230,160,${1-age/s.life})`;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-s.vx*.02,y-(s.vy+900*age)*.02);ctx.stroke();}ctx.restore();}

  {const lx=Ls.x+Math.cos(Ls.a)*255,ly=Ls.y+Math.sin(Ls.a)*255;label(t,7.15,9.3,'Feuerzeug',lx,ly,70,-110,'#ff7a45');}

function drawFrame(t){

const RENDER=/[?&]render/.test(location.search);
window.READY=(async()=>{try{await document.fonts.load(`800 40px Inter`);await document.fonts.load(`600 30px Inter`);await document.fonts.load(`500 30px Inter`);}catch(e){}
  BG_SHARP=makeBG(1.5,0);BG_BLUR=makeBG(.75,5);return true;})();
window.drawFrame=drawFrame;
if(!RENDER){let t0=null,paused=false,tp=0;const hint=document.getElementById('hint');setTimeout(()=>hint.style.opacity=0,3500);
  window.READY.then(()=>{const loop=n=>{if(t0===null)t0=n-tp*1000;if(!paused)tp=Math.min(DUR,(n-t0)/1000);drawFrame(tp);requestAnimationFrame(loop);};requestAnimationFrame(loop);});
  const seek=v=>{tp=clamp(v,0,DUR);t0=null;if(tp<T.info+.5)BLUR_CACHE=null;};
  addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;t0=null;e.preventDefault();}else if(e.code==='ArrowRight')seek(tp+1);else if(e.code==='ArrowLeft')seek(tp-1);else if(e.key==='r'||e.key==='R'||e.code==='Home')seek(0);});
  cv.addEventListener('click',()=>{if(tp>=DUR)seek(0);else{paused=!paused;t0=null;}});}
